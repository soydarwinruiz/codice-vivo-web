# Genera el instalador de Windows (Códice vivo para escritorio).
# · En cada cambio de la app: el .exe queda como «artefacto» descargable en la pestaña Actions.
# · Al publicar una etiqueta vX.Y.Z: además crea una Release con el instalador y la versión portable.
name: Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['electron/**', 'src/**', 'public/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.js', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar instalador
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: CodiceVivo-Windows
          path: release/*.exe
          if-no-files-found: error
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
